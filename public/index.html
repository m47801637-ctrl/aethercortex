<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Cortex — Gemini Edition</title>

    <!-- Gemini SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234285F4' d='M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z'/></svg>">

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- PDF.js for PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Mammoth.js for Word DOCX text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-card: #1e1f20;
            --bg-input: #1e1f20;
            --bg-hover: #282a2c;
            --accent-gradient: linear-gradient(135deg, #4285f4, #9b51e0, #d96570);
            --accent-blue: #4285f4;
            --text-main: #e3e3e3;
            --text-sub: #c4c7c5;
            --text-muted: #8e918f;
            --border-subtle: #2e2f31;
            --radius-pill: 28px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --font-sans: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }

        /* Auth Overlay */
        #auth-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .auth-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            padding: 32px; border-radius: 24px; width: 100%; max-width: 380px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 20px;
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .btn-primary {
            background: #a8c7fa; color: #040e20; border: none; padding: 12px 18px;
            border-radius: var(--radius-pill); font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background: #d3e3fd; }

        /* Mobile Backdrop Overlay */
        #sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            z-index: 90; display: none; backdrop-filter: blur(4px);
        }

        /* Sidebar - Gemini Style */
        #sidebar {
            width: 280px; background: var(--bg-sidebar);
            display: flex; flex-direction: column; padding: 16px 12px; gap: 14px; z-index: 100;
            transition: transform 0.3s ease; border-right: 1px solid var(--border-subtle);
        }
        .brand { font-size: 1.2rem; font-weight: 600; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
        
        .new-chat-btn {
            background: #282a2c; color: var(--text-main); border: none;
            padding: 12px 18px; border-radius: var(--radius-pill); font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 12px; font-size: 0.9rem; transition: background 0.2s;
        }
        .new-chat-btn:hover { background: #333538; }

        #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .chat-item {
            padding: 10px 14px; border-radius: var(--radius-pill); cursor: pointer; font-size: 0.85rem;
            color: var(--text-sub); display: flex; align-items: center; justify-content: space-between;
        }
        .chat-item:hover, .chat-item.active { background: var(--bg-hover); color: var(--text-main); }
        .chat-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 8px; }
        .chat-actions { display: none; gap: 8px; }
        .chat-item:hover .chat-actions { display: flex; }

        .settings-panel {
            border-top: 1px solid var(--border-subtle); padding-top: 14px; display: flex;
            flex-direction: column; gap: 12px; font-size: 0.8rem;
        }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { color: var(--text-muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea {
            background: #131314; border: 1px solid var(--border-subtle); color: var(--text-main);
            padding: 10px 14px; border-radius: var(--radius-md); outline: none; font-size: 0.85rem;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }

        .memory-toggle-box {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: #131314; border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }

        /* Main Workspace */
        #main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; width: 100%; overflow: hidden; }
        header {
            padding: 14px 24px; background: var(--bg-main);
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }

        #mobile-menu-btn { display: none; }

        #chat-container { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 28px; }
        .message-row { display: flex; gap: 18px; max-width: 820px; margin: 0 auto; width: 100%; padding: 0 24px; position: relative; }
        
        .avatar {
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.9rem; flex-shrink: 0;
        }
        .message-row.user .avatar { background: #333538; color: #e3e3e3; }
        .message-row.bot .avatar { background: transparent; font-size: 1.2rem; }

        .message-body { flex: 1; line-height: 1.7; font-size: 0.98rem; overflow-x: auto; color: var(--text-main); }
        .message-row.user .message-body {
            background: #282a2c; padding: 12px 20px; border-radius: 20px;
            display: inline-block; max-width: 85%; align-self: flex-end;
        }

        .msg-actions { margin-top: 10px; display: flex; gap: 12px; font-size: 0.8rem; color: var(--text-muted); }
        .msg-btn { cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .msg-btn:hover { color: var(--text-main); }

        /* Code Block Styling */
        pre { border-radius: var(--radius-md); margin: 12px 0; overflow: hidden; }
        .run-code-btn {
            position: absolute; top: 10px; right: 10px; background: var(--accent-blue); color: white;
            border: none; padding: 5px 12px; border-radius: var(--radius-pill); font-size: 0.75rem; cursor: pointer;
            font-weight: 600; display: flex; align-items: center; gap: 6px; z-index: 5;
        }

        /* Thinking Accordion */
        .thinking-box {
            background: #1e1f20; border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); margin-bottom: 14px; overflow: hidden; font-size: 0.88rem;
        }
        .thinking-header { padding: 10px 14px; color: var(--text-sub); cursor: pointer; display: flex; justify-content: space-between; }
        .thinking-content { padding: 14px; color: var(--text-muted); font-style: italic; display: none; border-top: 1px solid var(--border-subtle); white-space: pre-wrap; }
        .thinking-box.open .thinking-content { display: block; }

        /* Gemini Floating Pill Input Box */
        #input-container { padding: 12px 24px 28px; background: var(--bg-main); }
        .input-box {
            max-width: 820px; margin: 0 auto; background: var(--bg-input);
            border: 1px solid var(--border-subtle); border-radius: var(--radius-pill);
            padding: 8px 16px; display: flex; align-items: flex-end; gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: #4285f4; }
        #user-input { width: 100%; background: transparent; border: none; color: var(--text-main); resize: none; max-height: 160px; min-height: 28px; outline: none; font-size: 0.98rem; padding: 4px 0; }
        
        .file-badge {
            background: #282a2c; border: 1px solid var(--border-subtle); padding: 6px 12px;
            border-radius: var(--radius-pill); font-size: 0.78rem; color: #a8c7fa; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; width: fit-content;
        }

        .icon-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; padding: 8px; transition: color 0.2s; border-radius: 50%; flex-shrink: 0; }
        .icon-btn:hover { color: var(--text-main); background: #282a2c; }
        .icon-btn.recording { color: #ea4335; animation: pulse 1s infinite; }

        /* Modal */
        #playground-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 2000; display: none; flex-direction: column; padding: 16px;
        }
        #playground-modal.active { display: flex; }
        .playground-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; }
        #playground-frame { width: 100%; height: 100%; background: white; border-radius: var(--radius-lg); border: none; }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            #mobile-menu-btn { display: inline-block; }
            #sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); box-shadow: 4px 0 24px rgba(0,0,0,0.6); }
            #sidebar.open { transform: translateX(0); }
            #sidebar-overlay.active { display: block; }
            .message-row { padding: 0 14px; gap: 12px; }
            .message-row.user .message-body { max-width: 90%; }
            #input-container { padding: 8px 14px 16px; }
        }
    </style>
</head>
<body>

    <!-- Auth System Overlay -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="text-align: center;"><i class="fa-solid fa-wand-magic-sparkles gradient-text"></i> <span class="gradient-text">Aether Cortex</span></h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="auth-username" placeholder="Enter username">
            </div>
            <button class="btn-primary" onclick="login()">Get Started</button>
        </div>
    </div>

    <!-- Mobile Overlay Backdrop -->
    <div id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <!-- Playground Modal -->
    <div id="playground-modal">
        <div class="playground-header">
            <h4><i class="fa-solid fa-play gradient-text"></i> Live Code Playground</h4>
            <button class="icon-btn" onclick="closePlayground()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <iframe id="playground-frame"></iframe>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-wand-magic-sparkles gradient-text"></i> <span class="gradient-text">Aether</span></span>
            <button class="icon-btn" onclick="closeMobileSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i>
            <span>New Chat</span>
        </button>

        <div id="chat-list"></div>

        <div class="settings-panel">
            <div class="input-group">
                <label>NVIDIA API Key</label>
                <input type="password" id="api-key" placeholder="nvapi-..." onchange="saveSettings()">
            </div>
            <div class="input-group">
                <label>Model</label>
                <select id="model-select" onchange="saveSettings()">
                    <option value="deepseek-ai/deepseek-r1">DeepSeek R1 (Reasoning)</option>
                    <option value="meta/llama-3.3-70b-instruct">Llama 3.3 70B Instruct</option>
                    <option value="nvidia/llama-3.1-nemotron-70b-instruct">Nemotron 3.1 70B</option>
                </select>
            </div>

            <div class="memory-toggle-box">
                <span style="color: var(--text-sub); font-size: 0.78rem; font-weight:500;"><i class="fa-solid fa-brain gradient-text"></i> Deep Workspace Memory</span>
                <input type="checkbox" id="memory-toggle" checked onchange="saveSettings()" style="cursor:pointer;">
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="main">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="icon-btn" id="mobile-menu-btn" onclick="openMobileSidebar()"><i class="fa-solid fa-bars"></i></button>
                <select id="persona-select" style="background: var(--bg-card); border-radius: var(--radius-pill); font-weight: 500;" onchange="saveSettings()">
                    <option value="general">✨ Gemini Assistant</option>
                    <option value="coder">👨‍💻 Code Architect</option>
                    <option value="writer">📝 Content Creator</option>
                    <option value="logic">🧠 Logic & Math Solver</option>
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="username-display" style="font-size: 0.88rem; font-weight: 500;">User</span>
                <i class="fa-solid fa-right-from-bracket icon-btn" onclick="logout()" title="Logout"></i>
            </div>
        </header>

        <div id="chat-container"></div>

        <div id="input-container">
            <div id="file-preview"></div>
            <div class="input-box">
                <input type="file" id="file-input" style="display: none;" accept=".txt,.js,.py,.html,.css,.json,.md,.pdf,.docx" onchange="handleFileUpload(event)">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Attach File"><i class="fa-solid fa-paperclip"></i></button>
                <button class="icon-btn" id="mic-btn" onclick="toggleVoiceInput()" title="Voice Input"><i class="fa-solid fa-microphone"></i></button>
                
                <textarea id="user-input" rows="1" placeholder="Ask Gemini..." onkeydown="handleKeyDown(event)"></textarea>
                
                <button class="icon-btn" id="send-btn" onclick="sendMessage()" style="color: #4285f4;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Setup PDF.js Worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        let currentUser = localStorage.getItem('aether_user');
        let chats = [];
        let currentChatId = null;
        let attachedFileContent = "";
        let recognition = null;

        window.onload = () => {
            if (currentUser) {
                document.getElementById('auth-overlay').style.display = 'none';
                initApp();
            }
        };

        function openMobileSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebar-overlay').classList.add('active');
        }

        function closeMobileSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('active');
        }

        function login() {
            const user = document.getElementById('auth-username').value.trim();
            if (!user) return alert('Enter username');
            localStorage.setItem('aether_user', user);
            currentUser = user;
            document.getElementById('auth-overlay').style.display = 'none';
            initApp();
        }

        function logout() { localStorage.removeItem('aether_user'); location.reload(); }

        function initApp() {
            document.getElementById('username-display').innerText = currentUser;
            chats = JSON.parse(localStorage.getItem(`chats_${currentUser}`) || '[]');
            loadSettings();
            if (chats.length === 0) createNewChat();
            else selectChat(chats[0].id);
        }

        function saveSettings() {
            localStorage.setItem(`api_key_${currentUser}`, document.getElementById('api-key').value);
            localStorage.setItem(`model_${currentUser}`, document.getElementById('model-select').value);
            localStorage.setItem(`persona_${currentUser}`, document.getElementById('persona-select').value);
            localStorage.setItem(`memory_toggle_${currentUser}`, document.getElementById('memory-toggle').checked);
        }

        function loadSettings() {
            document.getElementById('api-key').value = localStorage.getItem(`api_key_${currentUser}`) || '';
            document.getElementById('model-select').value = localStorage.getItem(`model_${currentUser}`) || 'deepseek-ai/deepseek-r1';
            document.getElementById('persona-select').value = localStorage.getItem(`persona_${currentUser}`) || 'general';
            
            const savedMemory = localStorage.getItem(`memory_toggle_${currentUser}`);
            document.getElementById('memory-toggle').checked = savedMemory !== null ? (savedMemory === 'true') : true;
        }

        function createNewChat() {
            const newChat = { id: Date.now().toString(), title: 'New chat', messages: [] };
            chats.unshift(newChat);
            saveChats();
            selectChat(newChat.id);
            closeMobileSidebar();
        }

        function selectChat(id) {
            currentChatId = id;
            renderChatList();
            renderMessages();
            closeMobileSidebar();
        }

        function saveChats() { localStorage.setItem(`chats_${currentUser}`, JSON.stringify(chats)); }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => selectChat(chat.id);
                item.innerHTML = `
                    <span class="chat-title-text"><i class="fa-regular fa-message"></i> ${chat.title}</span>
                    <div class="chat-actions">
                        <i class="fa-solid fa-trash" onclick="deleteChat('${chat.id}', event)"></i>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            saveChats();
            if (chats.length === 0) createNewChat();
            else selectChat(chats[0].id);
        }

        function renderMessages() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            chat.messages.forEach(msg => appendMessageDOM(msg.role, msg.content));
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageDOM(role, contentText) {
            const container = document.getElementById('chat-container');
            const msgRow = document.createElement('div');
            msgRow.className = `message-row ${role === 'user' ? 'user' : 'bot'}`;

            msgRow.innerHTML = `
                <div class="avatar">${role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-wand-magic-sparkles gradient-text"></i>'}</div>
                <div class="message-body">
                    <div class="content"></div>
                    ${role === 'assistant' ? `
                    <div class="msg-actions">
                        <span class="msg-btn" onclick="speakText(this)"><i class="fa-solid fa-volume-high"></i> Speak</span>
                    </div>` : ''}
                </div>
            `;
            container.appendChild(msgRow);
            const contentDiv = msgRow.querySelector('.content');
            updateMessageContent(contentDiv, contentText);
            container.scrollTop = container.scrollHeight;
            return contentDiv;
        }

        function updateMessageContent(element, rawText) {
            let thinkText = "", responseText = rawText, isThinking = false;

            if (rawText.includes('<think>')) {
                const parts = rawText.split('</think>');
                if (parts.length > 1) {
                    thinkText = parts[0].replace('<think>', '').trim();
                    responseText = parts[1].trim();
                } else {
                    isThinking = true;
                    thinkText = rawText.replace('<think>', '').trim();
                    responseText = "";
                }
            }

            let html = "";
            if (thinkText || isThinking) {
                html += `
                    <div class="thinking-box ${isThinking ? 'open' : ''}">
                        <div class="thinking-header" onclick="this.parentElement.classList.toggle('open')">
                            <span><i class="${isThinking ? 'fa-solid fa-spinner' : 'fa-solid fa-lightbulb'} gradient-text"></i> ${isThinking ? 'Thinking...' : 'Thoughts'}</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <div class="thinking-content">${thinkText}</div>
                    </div>
                `;
            }

            html += marked.parse(responseText);
            element.innerHTML = html;

            element.querySelectorAll('pre code').forEach(codeBlock => {
                hljs.highlightElement(codeBlock);
                const parent = codeBlock.parentElement;
                if (!parent.querySelector('.run-code-btn')) {
                    const runBtn = document.createElement('button');
                    runBtn.className = 'run-code-btn';
                    runBtn.innerHTML = '<i class="fa-solid fa-play"></i> Run Code';
                    runBtn.onclick = () => launchPlayground(codeBlock.innerText);
                    parent.style.position = 'relative';
                    parent.appendChild(runBtn);
                }
            });
        }

        function launchPlayground(code) {
            const modal = document.getElementById('playground-modal');
            const iframe = document.getElementById('playground-frame');
            modal.classList.add('active');
            iframe.srcdoc = code.includes('<!DOCTYPE') || code.includes('<html>') ? code : `
                <!DOCTYPE html>
                <html>
                <head><style>body { font-family: sans-serif; padding: 20px; color: #333; }</style></head>
                <body><div id="app"></div><script>${code}<\/script></body>
                </html>
            `;
        }

        function closePlayground() { document.getElementById('playground-modal').classList.remove('active'); }

        // --- ENHANCED FILE ATTACHMENT SYSTEM (PDF, DOCX, TEXT) ---
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            showFileBadge(file.name, "Processing...");

            try {
                if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
                    attachedFileContent = await extractPdfText(file);
                } else if (file.name.endsWith('.docx')) {
                    attachedFileContent = await extractDocxText(file);
                } else {
                    attachedFileContent = await readAsPlainText(file);
                }

                showFileBadge(file.name, "Ready");
            } catch (err) {
                alert("Error reading file: " + err.message);
                document.getElementById('file-preview').innerHTML = "";
                attachedFileContent = "";
            }
        }

        function showFileBadge(fileName, status) {
            document.getElementById('file-preview').innerHTML = `
                <div class="file-badge">
                    <i class="fa-solid fa-file-lines"></i> ${fileName} (${status})
                    <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="attachedFileContent=''; document.getElementById('file-preview').innerHTML=''"></i>
                </div>
            `;
        }

        function readAsPlainText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => resolve(event.target.result);
                reader.onerror = (error) => reject(error);
                reader.readAsText(file);
            });
        }

        function extractPdfText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let fullText = "";

                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            fullText += `--- Page ${i} ---\n` + pageText + '\n\n';
                        }
                        resolve(fullText);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = (err) => reject(err);
                reader.readAsArrayBuffer(file);
            });
        }

        function extractDocxText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const result = await mammoth.extractRawText({ arrayBuffer: e.target.result });
                        resolve(result.value);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = (err) => reject(err);
                reader.readAsArrayBuffer(file);
            });
        }

        function toggleVoiceInput() {
            const micBtn = document.getElementById('mic-btn');
            if (!('webkitSpeechRecognition' in window)) return alert('Speech recognition not supported.');

            if (recognition) {
                recognition.stop();
                recognition = null;
                micBtn.classList.remove('recording');
                return;
            }

            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.onresult = (e) => {
                document.getElementById('user-input').value += ' ' + e.results[0][0].transcript;
                micBtn.classList.remove('recording');
                recognition = null;
            };
            recognition.start();
            micBtn.classList.add('recording');
        }

        function speakText(btn) {
            const text = btn.parentElement.parentElement.querySelector('.content').innerText;
            const utterance = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(utterance);
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function extractUserGlobalMemory() {
            let memorySummary = "GLOBAL USER CONTEXT & PAST CHATS HISTORY:\n";
            let totalEntries = 0;

            chats.forEach(chat => {
                if (chat.messages && chat.messages.length > 0) {
                    memorySummary += `\n--- Conversation Topic: "${chat.title}" ---\n`;
                    chat.messages.slice(-6).forEach(m => {
                        memorySummary += `${m.role.toUpperCase()}: ${m.content.substring(0, 300)}\n`;
                    });
                    totalEntries++;
                }
            });

            return totalEntries > 0 ? memorySummary : "";
        }

        async function sendMessage() {
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) return alert('Enter NVIDIA API Key in sidebar!');

            const inputField = document.getElementById('user-input');
            let prompt = inputField.value.trim();
            if (!prompt && !attachedFileContent) return;

            if (attachedFileContent) {
                prompt = `[Attached File Content]:\n${attachedFileContent}\n\n[User Query]: ${prompt}`;
                attachedFileContent = "";
                document.getElementById('file-preview').innerHTML = "";
            }

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) {
                chat.title = prompt.substring(0, 20) + '...';
                renderChatList();
            }

            const payloadMessages = [];

            const persona = document.getElementById('persona-select').value;
            let personaPrompt = "You are Aether Cortex, an advanced AI Assistant styled like Gemini.";
            if (persona === 'coder') personaPrompt = "You are an elite Senior Software Architect. Audit code rigorously.";
            else if (persona === 'writer') personaPrompt = "You are a professional tech writer. Craft engaging content.";
            else if (persona === 'logic') personaPrompt = "Solve problems step-by-step with deep logical reasoning.";

            const isMemoryEnabled = document.getElementById('memory-toggle').checked;
            if (isMemoryEnabled) {
                const globalMemory = extractUserGlobalMemory();
                if (globalMemory) {
                    personaPrompt += `\n\n[CROSS-CHAT MEMORY]\nYou have access to the user's prior workspace chats context below. Use this to provide personalized, connected answers:\n${globalMemory}`;
                }
            }

            payloadMessages.push({ role: 'system', content: personaPrompt });
            chat.messages.forEach(m => payloadMessages.push(m));
            payloadMessages.push({ role: 'user', content: prompt });

            chat.messages.push({ role: 'user', content: prompt });
            appendMessageDOM('user', prompt);
            inputField.value = '';

            const botContentDOM = appendMessageDOM('assistant', '');
            botContentDOM.innerHTML = `<span class="gradient-text">Thinking...</span>`;

            document.getElementById('send-btn').disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        apiKey: apiKey,
                        model: document.getElementById('model-select').value,
                        messages: payloadMessages
                    })
                });

                if (!response.ok) throw new Error(await response.text());

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let rawStreamText = "", isFirstToken = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                const token = parsed.choices[0]?.delta?.content || '';
                                if (token) {
                                    if (isFirstToken) { botContentDOM.innerHTML = ''; isFirstToken = false; }
                                    rawStreamText += token;
                                    updateMessageContent(botContentDOM, rawStreamText);
                                }
                            } catch (e) {}
                        }
                    }
                }

                chat.messages.push({ role: 'assistant', content: rawStreamText });
                saveChats();

            } catch (err) {
                botContentDOM.innerHTML = `<span style="color:#ea4335;">Error: ${err.message}</span>`;
            } finally {
                document.getElementById('send-btn').disabled = false;
            }
        }
    </script>
</body>
